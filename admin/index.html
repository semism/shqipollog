<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shqipollog admin</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
    <script>
        try {
            const t = localStorage.getItem('shqipollog-theme');
            document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        } catch (e) {
            document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
    </script>
    <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
    <header class="bar">
        <h1>shqipollog <span>admin</span></h1>
        <span id="status"></span>
        <span class="grow"></span>
        <select id="new" aria-label="Hyrje e re">
            <option value="">+ hyrje e re</option>
            <option value="folje">folje</option>
            <option value="emra">emër</option>
            <option value="mbiemra">mbiemër</option>
            <option value="ndajfolje">ndajfolje</option>
            <option value="gramatike">gramatikë</option>
            <option value="blog">blog</option>
        </select>
        <button class="btn" id="theme" type="button" title="Tema"></button>
        <button class="btn primary" id="save" type="button" title="Ctrl+S">Ruaj</button>
    </header>
    <main class="app">
        <nav class="list">
            <input id="q" type="search" placeholder="Kërko…" autocomplete="off">
            <div class="filters" id="filters"></div>
            <div id="items"></div>
        </nav>
        <section class="form" id="form"></section>
        <section class="prev">
            <p>Parapamje, ashtu si del në faqe</p>
            <iframe id="preview" title="Parapamje"></iframe>
        </section>
    </main>

    <script src="/taxonomy.js"></script>
    <script src="/shared.js"></script>
    <script>const TOKEN = '__TOKEN__';</script>
    <script src="/admin/admin.js"></script>
</body>
</html>
